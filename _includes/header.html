{% assign t = site.data.i18n[page.lang] | default: site.data.i18n.en %}
{% assign home_url = site.data.routes.home[page.lang] | default: '/' | relative_url %}
<header class="site-header">
  <a href="{{ home_url }}" class="header-brand">{{ site.data.site.brand }}</a>
  <button id="menuToggle" class="header-menu-btn" aria-expanded="false" aria-controls="menuOverlay">{{ t.nav.menu }}</button>
</header>
